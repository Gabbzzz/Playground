<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eutopia RPG</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#05010d;
    color:white;
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top,
    rgba(143,0,255,0.14),
    transparent 40%),

    radial-gradient(circle at bottom,
    rgba(93,0,255,0.08),
    transparent 40%);

    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;

    background-image:
    radial-gradient(rgba(180,120,255,0.14) 1px,
    transparent 1px);

    background-size:60px 60px;

    opacity:0.08;

    z-index:-1;
}

/* HEADER */

.hero{
    width:100%;
    height:620px;
    position:relative;
    overflow:hidden;

    border-bottom:
    1px solid rgba(170,120,255,0.14);
}

/* HEADER IMAGE */

.hero img{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    filter:
    brightness(0.9)
    saturate(1.15);
}

/* DARK OVERLAY */
/* TADY JE TA PRŮHLEDNÁ TMAVÁ VRSTVA */

.hero::after{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(to bottom,

    rgba(5,1,13,0.02),
    rgba(5,1,13,0.12),
    rgba(5,1,13,0.55));

}

/* MAGIC GLOW */

.glow{
    position:absolute;

    width:800px;
    height:800px;

    background:
    radial-gradient(circle,
    rgba(170,80,255,0.13),
    transparent 70%);

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:2;
}

/* PARTICLES */

.particle{
    position:absolute;
    border-radius:50%;

    background:#bb7cff;

    opacity:0.7;

    animation:float linear infinite;

    z-index:5;
}

.p1{
    width:4px;
    height:4px;

    left:20%;
    top:70%;

    animation-duration:7s;
}

.p2{
    width:6px;
    height:6px;

    left:65%;
    top:80%;

    animation-duration:10s;
}

.p3{
    width:3px;
    height:3px;

    left:80%;
    top:60%;

    animation-duration:8s;
}

.p4{
    width:5px;
    height:5px;

    left:40%;
    top:85%;

    animation-duration:12s;
}

@keyframes float{

    from{
        transform:translateY(0px);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-300px);
        opacity:0;
    }

}

/* CONTENT */

.content{
    max-width:1200px;

    margin:auto;

    padding:70px 20px;
}

/* CARDS */

.card{

    position:relative;

    background:
    linear-gradient(
    to bottom,
    rgba(28,10,50,0.72),
    rgba(10,2,25,0.82));

    border:
    1px solid rgba(190,120,255,0.22);

    border-radius:22px;

    padding:32px;

    margin-bottom:30px;

    overflow:hidden;

    backdrop-filter:blur(12px);

    box-shadow:
    0 0 18px rgba(120,0,255,0.18),
    inset 0 0 20px rgba(255,255,255,0.03);
}

/* INNER BORDER */

.card::before{

    content:"";

    position:absolute;

    inset:6px;

    border:
    1px solid rgba(255,255,255,0.06);

    border-radius:16px;

    pointer-events:none;
}

/* MAGIC LIGHT */

.card::after{

    content:"";

    position:absolute;

    width:300px;
    height:300px;

    background:
    radial-gradient(circle,
    rgba(170,80,255,0.12),
    transparent 70%);

    top:-120px;
    right:-80px;

    pointer-events:none;
}
/* TITLES */

.card h2{

    font-family:'Orbitron', sans-serif;

    margin-bottom:15px;

    color:#d9a8ff;

    font-size:28px;
}

/* TEXT */

.card p{

    line-height:1.8;

    color:#d5d0df;

    font-size:16px;
}

footer{

    text-align:center;

    padding:40px;

    color:#8b7e9d;

    border-top:
    1px solid rgba(170,120,255,0.12);

    margin-top:40px;
}

/* MOBILE */

/* BUTTONS */

/* BUTTON CONTAINER */

.hero-buttons{

    position:absolute;

    bottom:22px;
    left:50%;

    transform:translateX(-50%);

    width:95%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    z-index:15;
}

/* BUTTON */

.magic-btn{

    position:relative;

    width:23%;

    padding:18px 10px;

    text-align:center;

    text-decoration:none;

    font-family:'Orbitron', sans-serif;

    font-size:22px;

    letter-spacing:2px;

    color:#f4ddff;

    background:
    linear-gradient(to bottom,
    rgba(70,15,120,0.72),
    rgba(20,0,45,0.92));

    border:
    2px solid rgba(210,140,255,0.85);

    clip-path:polygon(
    12px 0%,
    calc(100% - 12px) 0%,
    100% 12px,
    100% calc(100% - 12px),
    calc(100% - 12px) 100%,
    12px 100%,
    0% calc(100% - 12px),
    0% 12px
    );

    overflow:hidden;

    box-shadow:
    0 0 8px rgba(190,100,255,0.7),
    0 0 18px rgba(120,0,255,0.5),
    inset 0 0 10px rgba(255,255,255,0.08);

    transition:0.35s;
}

/* INNER GLOW */

.magic-btn::before{

    content:"";

    position:absolute;

    inset:2px;

    border:
    1px solid rgba(255,255,255,0.14);

    clip-path:polygon(
    10px 0%,
    calc(100% - 10px) 0%,
    100% 10px,
    100% calc(100% - 10px),
    calc(100% - 10px) 100%,
    10px 100%,
    0% calc(100% - 10px),
    0% 10px
    );

    pointer-events:none;
}

/* MAGIC CORNERS */

.magic-btn::after{

    content:"✦";

    position:absolute;

    top:-10px;
    left:50%;

    transform:translateX(-50%);

    font-size:12px;

    color:#e9b8ff;

    text-shadow:
    0 0 10px #d26cff;
}

/* HOVER */

.magic-btn:hover{

    transform:
    translateY(-3px)
    scale(1.03);

    border-color:#ffd6ff;

    box-shadow:
    0 0 12px rgba(220,140,255,0.9),
    0 0 35px rgba(140,0,255,0.7),
    inset 0 0 14px rgba(255,255,255,0.1);
}

    /* COMMENT SECTION */

.comment-section{

    width:100%;

    max-width:1400px;

    margin:
    80px auto;

}

/* BOX */

.comment-box{

    background:
    linear-gradient(
    to bottom,
    rgba(22,8,40,0.92),
    rgba(8,2,20,0.95));

    border:
    1px solid rgba(200,120,255,0.22);

    border-radius:28px;

    padding:40px;

    box-shadow:
    0 0 30px rgba(140,0,255,0.15);

    margin-bottom:40px;
}

/* TITLE */

.comment-title{

    font-family:'Orbitron', sans-serif;

    font-size:42px;

    text-align:center;

    margin-bottom:35px;

    color:#f1d0ff;

    text-shadow:
    0 0 12px #c86cff,
    0 0 30px rgba(180,80,255,0.6);
}

/* INPUTS */

.comment-box input,
.comment-box textarea{

    width:100%;

    background:
    rgba(10,2,25,0.92);

    border:
    1px solid rgba(190,120,255,0.2);

    border-radius:16px;

    padding:18px;

    margin-bottom:20px;

    color:white;

    font-size:20px;

    font-family:'Inter', sans-serif;

    outline:none;

    box-shadow:
    inset 0 0 12px rgba(140,0,255,0.08);
}

.comment-box textarea{

    min-height:220px;

    resize:vertical;
}

/* PLACEHOLDER */

.comment-box input::placeholder,
.comment-box textarea::placeholder{

    color:#b79acb;
}

/* BUTTON */

.send-btn{

    width:100%;

    padding:18px;

    border:none;

    cursor:pointer;

    font-family:'Orbitron', sans-serif;

    font-size:22px;

    color:white;

    border-radius:18px;

    background:
    linear-gradient(
    to bottom,
    rgba(120,30,220,0.9),
    rgba(60,0,120,0.95));

    box-shadow:
    0 0 18px rgba(170,80,255,0.5);

    transition:0.3s;
}

.send-btn:hover{

    transform:scale(1.02);

    box-shadow:
    0 0 25px rgba(200,120,255,0.7);
}

/* HELP */

.format-help{

    margin-top:18px;

    color:#bda8d6;

    text-align:center;

    font-size:16px;
}

/* COMMENTS */

.comment{

    position:relative;

    display:flex;

    gap:25px;

    padding:30px;

    margin-bottom:30px;

    border-radius:24px;

    background:
    linear-gradient(
    to bottom,
    rgba(18,6,35,0.88),
    rgba(8,2,20,0.95));

    border:
    1px solid rgba(190,120,255,0.16);

    box-shadow:
    0 0 20px rgba(120,0,255,0.08);
}

/* AVATAR */

.comment-avatar{

    width:90px;
    height:90px;

    border-radius:50%;

    object-fit:cover;

    border:
    2px solid rgba(210,140,255,0.5);

    box-shadow:
    0 0 18px rgba(170,80,255,0.3);
}

/* CONTENT */

.comment-content{

    flex:1;
}

/* NAME */

.comment-name{

    font-family:'Orbitron', sans-serif;

    font-size:24px;

    color:#f1d0ff;

    margin-bottom:15px;

    text-shadow:
    0 0 10px rgba(180,80,255,0.5);
}

/* TEXT */

.comment-text{

    font-size:22px;

    line-height:1.9;

    color:#f4ecff;
}
    
</style>
</head>

<body>

<!-- HEADER -->

<header class="hero">

    <!-- TVŮJ OBRÁZEK -->
    <img src="Eutopia.png" alt="Eutopia RPG">

    <!-- MAGIC GLOW -->
    <div class="glow"></div>

    <!-- BUTTONS -->

<div class="hero-buttons">

    <a href="#" class="magic-btn">
        REGISTRACE
    </a>

    <a href="#" class="magic-btn">
        REÁLIE
    </a>

    <a href="#" class="magic-btn">
        POSTAVY
    </a>

    <a href="#" class="magic-btn">
        HRA
    </a>

</div>

    <!-- MAGIC PARTICLES -->

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>

</header>


     <!-- COMMENT SECTION -->

<section class="comment-section">

    <div class="comment-box">

        <h2 class="comment-title">
            KOMENTÁŘE
        </h2>

        <input type="text" id="username" placeholder="Jméno">

        <input type="file" id="avatar" accept="image/*">

        <textarea id="message" placeholder="Text komentáře..."></textarea>

        <button onclick="addComment()" class="send-btn">
            ODESLAT
        </button>

        <div class="format-help">
            Podporované značky:
            [b]tučně[/b]
            [i]kurzíva[/i]
            [u]podtržení[/u]
        </div>

    </div>

    <div id="comments"></div>

<!-- FOOTER -->

<footer>
    © 2026 Eutopia RPG
</footer>
<script>

function parseBBCode(text){

    return text
        .replace(/\[b\](.*?)\[\/b\]/gi, "<strong>$1</strong>")
        .replace(/\[i\](.*?)\[\/i\]/gi, "<em>$1</em>")
        .replace(/\[u\](.*?)\[\/u\]/gi, "<u>$1</u>")
        .replace(/\n/g, "<br>");
}

function addComment(){

    const username =
        document.getElementById("username").value;

    const message =
        document.getElementById("message").value;

    const avatarInput =
        document.getElementById("avatar");

    if(!username || !message){
        return;
    }

    const comments =
        document.getElementById("comments");

    const comment =
        document.createElement("div");

    comment.className = "comment";

    const reader = new FileReader();

    reader.onload = function(e){

        comment.innerHTML = `

            <img src="${e.target.result}"
            class="comment-avatar">

            <div class="comment-content">

                <div class="comment-name">
                    ${username}
                </div>

                <div class="comment-text">
                    ${parseBBCode(message)}
                </div>

            </div>

        `;

        comments.prepend(comment);
    };

    if(avatarInput.files[0]){

        reader.readAsDataURL(
            avatarInput.files[0]
        );

    } else {

        comment.innerHTML = `

            <div class="comment-content">

                <div class="comment-name">
                    ${username}
                </div>

                <div class="comment-text">
                    ${parseBBCode(message)}
                </div>

            </div>

        `;

        comments.prepend(comment);
    }

    document.getElementById("username").value = "";
    document.getElementById("message").value = "";
    document.getElementById("avatar").value = "";
}

</script>
</body>
</html>
